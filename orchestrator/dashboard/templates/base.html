<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Orchestrator Dashboard{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
           background: #f5f6f8; color: #222; }
    nav { background: #1f2937; padding: 0 24px; display: flex; align-items: center; gap: 4px; }
    nav .brand { color: #fff; font-weight: 600; padding: 14px 20px 14px 0; }
    nav a { color: #cbd5e1; text-decoration: none; padding: 14px 16px; font-size: 14px; }
    nav a.active, nav a:hover { color: #fff; background: #374151; }
    nav a.disabled { color: #6b7280; pointer-events: none; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 15px; margin: 24px 0 10px; color: #374151; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px 16px; }
    .card .label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
    .card .value { font-size: 24px; font-weight: 600; }
    .card .sub { font-size: 12px; color: #9ca3af; margin-top: 6px; }
    .bar { height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .bar > div { height: 100%; background: #2563eb; border-radius: 4px; }
    .bar.hot > div { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 8px 14px; font-size: 13px;
             border-bottom: 1px solid #f0f1f3; }
    th { background: #fafbfc; color: #6b7280; font-weight: 500; }
    .muted { color: #9ca3af; font-size: 13px; }
    .error-banner { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
                    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
    .info-banner { background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
                   border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
    td.actions form { display: inline-block; margin-right: 6px; }
    td.actions button { border: 1px solid #d1d5db; background: #fff; border-radius: 6px;
                        padding: 4px 12px; font-size: 12px; cursor: pointer; }
    td.actions button.ok { background: #2563eb; border-color: #2563eb; color: #fff; }
    td.actions button.no { color: #b91c1c; border-color: #fca5a5; }
    .cards a.card { text-decoration: none; color: inherit; }
    .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px;
                  flex-wrap: wrap; }
    .filter-bar select, .filter-bar input[type=text] { padding: 6px 10px;
      border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; background: #fff; }
    .filter-bar button { padding: 6px 16px; border: 1px solid #2563eb; background: #2563eb;
      color: #fff; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .filter-bar a.reset { font-size: 13px; color: #6b7280; }
    table.swim { table-layout: fixed; }
    table.swim th.proj, table.swim td.proj { width: 140px; }
    table.swim td { vertical-align: top; }
    .chip { display: block; background: #eff6ff; border: 1px solid #bfdbfe;
            border-radius: 6px; padding: 4px 8px; margin: 0 0 6px; font-size: 12px;
            color: #1e40af; text-decoration: none; }
    .chip:hover { background: #dbeafe; }
    .chip .sum { color: #6b7280; }
    .strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
              gap: 12px; }
    .strip { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
             padding: 12px 16px; text-decoration: none; color: inherit; display: block; }
    .strip:hover { border-color: #2563eb; }
    .strip .name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .strip .counts { display: flex; gap: 12px; font-size: 12px; color: #6b7280; }
    .strip .counts b { font-size: 16px; color: #111827; margin-right: 2px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Orchestrator</span>
    <a href="/" class="{{ 'active' if active == 'overview' }}">总览</a>
    <a href="/tickets" class="{{ 'active' if active == 'tickets' }}">工单中心</a>
    <a href="/projects" class="{{ 'active' if active == 'projects' }}">项目中心</a>
    <a href="/approvals" class="{{ 'active' if active == 'approvals' }}">审批中心</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
