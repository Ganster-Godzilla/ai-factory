pool: pool
projects:
  orc-e2e: d:/workspace/tmp/orc-e2e   # M4 e2e 验收项目(T7 登记)
  sk-video-studio: d:/workspace/sk-video-studio   # 商K视频工具(2026-08-27 接入;首个全流程测试项目)
  ai-factory: d:/workspace/ai-factory   # 平台自身(2026-08-28 登记;编排器改进工单走自身流程,吃狗粮)
# deploy 段(T-2026-0901-004):release 契约补"部署"环节,按项目名登记部署配置。
# target 只有 local/remote 两形态,差异全部沉淀为配置值(代码零分支判断凭证/权限);
# 校验规则(target/必填键/路径存在性)在加载时完成,见 orchestrator/daemon/deploy.py。
deploy:
  sk-video-studio:
    target: remote
    host: "deploy@47.109.84.154"
    ssh_key: "~/.ssh/sk-aliyun-47"
    app_dir: "/data/apps/sk-video-studio"    # 其下 releases/<版本> 逐版留存 + current 软链(实测路径,2026-09-01 G8 校正)
    service: "sk-api"
    build_cmd: "npm run build --prefix apps/web"   # 前端本地构建 dist(服务器不装 node);实际前端在 apps/web
    dist_dir: "apps/web/dist"
    requirements: "apps/api/requirements.txt"      # 依赖差异前置检查基准(实际文件在 apps/api 下)
    env_example: ".env.example"              # 只比 key 名,值永不回传/入记录
    remote_env: "/data/apps/sk-video-studio/.env"
    restart_cmd: "sudo -n systemctl restart sk-api"  # sudo 白名单/User=deploy 二选一只改这里
    # 持久件(007 实证):release 内不存在,部署时从 app 根软链挂入——.env 与
    # 生产 SQLite/媒体库(data/),不挂则翻转后应用读到空配置+全新空库
    persist: [".env", "data"]
    smoke: ["http://47.109.84.154/api/health", "http://47.109.84.154/"]
  ai-factory:
    target: local
    processes:                               # 合并后自动重启的长驻进程清单(F7)
      - {name: dashboard, pidfile: ".orc-local/dashboard.pid",
         start_cmd: "python -m orchestrator.daemon.cli dashboard --port 8765"}
    smoke: ["http://127.0.0.1:8765/"]
thresholds:
  concurrent_max: 2
budgets:
  # 比较对象是共享池周总量(网关水位,含人工交互消耗)。2026-08-27 实测单日即 30 万,
  # 暂定 200 万救急(A);M4 dashboard 分行显示"池子水位/编排器消耗"后再定长久语义(B)
  # 2026-08-27:SK 项目启动,P0-P2 为 k3 密集阶段,200→300 万(用户批准)
  # 2026-08-28:网关周计数含 cache_read 虚高 5x+(T-001 会诊闸误触发时显示 15.7M,
  # 而 Kimi 控制台本周真实用量仅 9%)→ 临时提至 30M 解闸;
  # 治本=relay 周计数剔除 cache_read,入平台改进清单(T-2026-0828-003,M5)
  # 2026-09-02(T-2026-0902-009,boss 决策 B 方案):P3 执行层全切 k3 订阅池,
  # runner 流量(参照 09-01 实测 91M/天 ≈ 640M/周)并入水位 → 150M 必撞闸;
  # 提至 600M 并降级为观察期(明放同款 warn-only 语义:复审 2026-09-09 按真实曲线定终值)
  k3_week_token_budget: 600000000
  ds_daily_cny: 30
  # 明放模式(T-2026-0829-004,2026-08-29 boss 决策):磨合期 DS 双闸(日现金线/单工单
  # 预算帽)降级为 warn-only——超线写 budget_warn 事件放行,不卡 pipeline;
  # 复审双触发:review_after 到期 或 T-2026-0829-002(session.jsonl.zstd 解析)交付。
  # 复审时按 ledger estimated=true 条目对账,决定恢复硬闸或调整阈值。
  mingfang_mode: true
  review_after: "2026-09-12"
  # 无 usage trailer 时每次 dsh 调用估算入账价(禁止记 0);
  # DeepSeek 典型 dev 调用 ≈¥0.014,留 3 倍余量宁高估不低估
  ds_est_call_cny: 0.05
# dsh 会话文件真实计量费率表(T-2026-0829-002):官网标准价(2026-08),改价改配置
# cache hit 单独计价(真实计费项,但不进 tokens 字段——防水位虚高)
rates:
  deepseek:
    # deepseek-v4-flash 官网真实价(2026-08-17 涨价后,峰谷制;08-31 对账实证:
    # 旧值 cache_hit 0.5 虚高 10 倍,003 台账 ¥69.87 vs 实扣 ¥17.55,T-2026-0901-003)
    # 峰时(北京 9-12、14-18);谷时见 off_peak,按步时间戳计价(dsh_usage.price_session_usage)
    input_per_m: 3.0
    cache_hit_per_m: 0.10
    output_per_m: 9.0
    off_peak:
      input_per_m: 1.5
      cache_hit_per_m: 0.05
      output_per_m: 4.5
    peak_hours: [[9, 12], [14, 18]]
  glm:   # 免费期记 0,tokens 照记
    input_per_m: 0.0
    cache_hit_per_m: 0.0
    output_per_m: 0.0
  # OpenCode Zen 兜底(T-2026-0901-001):kimi-k3 官网 $3.00/$15.00 per 1M(2026-08 价,
  # cache read $0.30),按汇率 7.2 折算;改价/换模型改这里。消耗走 scripts/zen-usage-ledger.py
  # 周对账入账(estimated=true;relay 只记 input/output 总量,未拆 cache,宁高估不低估),
  # 不占 k3_week_token_budget(那是共享池水位闸)
  opencode:
    input_per_m: 21.6
    cache_hit_per_m: 2.16
    output_per_m: 108.0
gateway:
  url: http://127.0.0.1:8787
keys_dir: D:/Tool/keys
models:
  # 2026-08-28 GLM 体验卡切换 → 2026-08-29 晚 429 周额度耗尽(T-003 八任务+T2 切片烧完 2000 积分,
  # 2026-09-03 重置即到期),按用户预授权自动熔断切回 deepseek-v4-flash
  # GLM 对照实验结论:代码任务可靠(八缺口 7 次一次过),文档口径类任务指令遵循弱
  dev: deepseek-v4-flash
  qa: deepseek-v4-flash
