  # 暂定 200 万救急(A);M4 dashboard 分行显示"池子水位/编排器消耗"后再定长久语义(B)
  # 2026-08-27:SK 项目启动,P0-P2 为 k3 密集阶段,200→300 万(用户批准)
  # 2026-08-28:网关周计数含 cache_read 虚高 5x+(T-001 会诊闸误触发时显示 15.7M,
