pool: pool
projects:
  orc-e2e: d:/workspace/tmp/orc-e2e   # M4 e2e 验收项目(T7 登记)
  sk-video-studio: d:/workspace/sk-video-studio   # 商K视频工具(2026-08-27 接入;首个全流程测试项目)
  ai-factory: d:/workspace/ai-factory   # 平台自身(2026-08-28 登记;编排器改进工单走自身流程,吃狗粮)
thresholds:
  concurrent_max: 2
budgets:
  # 比较对象是共享池周总量(网关水位,含人工交互消耗)。2026-08-27 实测单日即 30 万,
  # 暂定 200 万救急(A);M4 dashboard 分行显示"池子水位/编排器消耗"后再定长久语义(B)
  # 2026-08-27:SK 项目启动,P0-P2 为 k3 密集阶段,200→300 万(用户批准)
  # 2026-08-28:网关周计数含 cache_read 虚高 5x+(T-001 会诊闸误触发时显示 15.7M,
  # 而 Kimi 控制台本周真实用量仅 9%)→ 临时提至 30M 解闸;
  # 治本=relay 周计数剔除 cache_read,入平台改进清单(T-2026-0828-003,M5)
  k3_week_token_budget: 150000000
  ds_daily_cny: 30
  # 明放模式(T-2026-0829-004,2026-08-29 boss 决策):磨合期 DS 双闸(日现金线/单工单
  # 预算帽)降级为 warn-only——超线写 budget_warn 事件放行,不卡 pipeline;
  # 复审双触发:review_after 到期 或 T-2026-0829-002(session.jsonl.zstd 解析)交付。
  # 复审时按 ledger estimated=true 条目对账,决定恢复硬闸或调整阈值。
  mingfang_mode: true
  review_after: "2026-09-12"
  # 无 usage trailer 时每次 dsh 调用估算入账价(禁止记 0);
  # DeepSeek 典型 dev 调用 ≈¥0.014,留 3 倍余量宁高估不低估
  ds_est_call_cny: 0.05
# dsh 会话文件真实计量费率表(T-2026-0829-002):官网标准价(2026-08),改价改配置
# cache hit 单独计价(真实计费项,但不进 tokens 字段——防水位虚高)
rates:
  deepseek:
    input_per_m: 2.0
    cache_hit_per_m: 0.5
    output_per_m: 8.0
  glm:   # 免费期记 0,tokens 照记
    input_per_m: 0.0
    cache_hit_per_m: 0.0
    output_per_m: 0.0
gateway:
  url: http://127.0.0.1:8787
keys_dir: D:/Tool/keys
models:
  # 2026-08-28 GLM 体验卡切换 → 2026-08-29 晚 429 周额度耗尽(T-003 八任务+T2 切片烧完 2000 积分,
  # 2026-09-03 重置即到期),按用户预授权自动熔断切回 deepseek-v4-flash
  # GLM 对照实验结论:代码任务可靠(八缺口 7 次一次过),文档口径类任务指令遵循弱
  dev: deepseek-v4-flash
  qa: deepseek-v4-flash
